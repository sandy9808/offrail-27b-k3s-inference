---
- name: Deploy containerised Offrail 27B to K3s
  hosts: k3s_nodes
  gather_facts: false
  tasks:
    - name: Verify K3s is ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
      changed_when: false
      become: true

    - name: Create manifest staging directory
      ansible.builtin.file:
        path: "{{ offrail_manifest_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"

    - name: Render Offrail K3s manifests
      ansible.builtin.template:
        src: "../kubernetes/{{ item }}.j2"
        dest: "{{ offrail_manifest_dir }}/{{ item }}"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0644"
      loop:
        - 00-namespace.yaml
        - 10-model-pvc.yaml
        - 20-llama-deployment.yaml

    - name: Verify Kubernetes advertises an allocatable NVIDIA GPU before cutover
      ansible.builtin.shell: >-
        /usr/local/bin/k3s kubectl get nodes -o json |
        python3 -c 'import json,sys; d=json.load(sys.stdin); g=[n.get("status",{}).get("allocatable",{}).get("nvidia.com/gpu","0") for n in d.get("items",[])]; print("allocatable nvidia.com/gpu:", ",".join(g)); sys.exit(0 if any(int(x)>0 for x in g) else 1)'
      register: gpu_capacity
      changed_when: false
      become: true

    - name: Verify the NVIDIA RuntimeClass exists before cutover
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - runtimeclass
          - "{{ offrail_runtime_class }}"
      changed_when: false
      become: true
      when: offrail_runtime_class | length > 0

    - name: Stop legacy host llama-server before claiming host port 8899
      ansible.builtin.command: "{{ offrail_host_model_dir }}/serve_offrail_8gb.sh --stop"
      changed_when: true
      when: cutover_legacy_llama | bool

    - name: Block unsafe deployment while legacy llama-server owns port 8899
      ansible.builtin.fail:
        msg: >-
          K3s uses hostNetwork to preserve http://127.0.0.1:8899 for Odysseus.
          Re-run with -e cutover_legacy_llama=true after the image is pushed.
      when: not (cutover_legacy_llama | bool)

    - name: Apply namespace, storage, workload, and service manifests
      ansible.builtin.command: /usr/local/bin/k3s kubectl apply -f {{ offrail_manifest_dir }}/{{ item }}
      loop:
        - 00-namespace.yaml
        - 10-model-pvc.yaml
        - 20-llama-deployment.yaml
      changed_when: true
      become: true

    - name: Remove the obsolete loopback-incompatible ClusterIP service
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - -n
          - "{{ offrail_namespace }}"
          - delete
          - service
          - "{{ offrail_release_name }}"
          - --ignore-not-found=true
      register: old_service
      changed_when: "'deleted' in old_service.stdout"
      become: true

    - name: Wait for Offrail deployment rollout
      ansible.builtin.command: >-
        /usr/local/bin/k3s kubectl -n {{ offrail_namespace }}
        rollout status deployment/{{ offrail_release_name }} --timeout=15m
      changed_when: false
      become: true

    - name: Verify host-compatible Offrail health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ offrail_port }}/health"
        method: GET
        status_code: 200
        return_content: true
      register: offrail_health
      retries: 30
      delay: 2
      until: offrail_health.status == 200

    - name: Restart Odysseus after successful backend cutover
      ansible.builtin.systemd:
        name: odysseus-ui
        state: restarted
      become: true
